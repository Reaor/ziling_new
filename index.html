<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <meta name="description" content="zicodo —— 有一只汉字精灵「字灵」陪伴的日程管理">
  <title>zicodo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="zicodo">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23fbfaf6'/%3E%3Cg fill='none' stroke='%2387C8B4' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 57 L37 31 L54 57'/%3E%3Cpath d='M66 57 L83 31 L100 57'/%3E%3Ccircle cx='60' cy='80' r='14'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <div id="phone">

    <!-- 开屏动画（汉字粒子聚成「字灵」+ 朱砂落印） -->
    <div id="splash" aria-hidden="true">
      <canvas id="splash-canvas"></canvas>
      <div id="splash-skip">轻触跳过</div>
    </div>

    <!-- 页面容器 -->
    <main id="pages">
      <section class="page" id="page-today"></section>
      <section class="page" id="page-calendar"></section>
      <section class="page" id="page-ziling">
        <div id="ziling-stage">
          <div id="ziling-loading"><img class="zl-load-logo" src="icons/logo.svg" alt=""><span>字灵苏醒中…</span></div>
        </div>
      </section>
      <section class="page" id="page-team"></section>
      <section class="page" id="page-me"></section>
    </main>

    <!-- 底部标签栏 -->
    <nav id="tabbar">
      <button class="tab" data-page="today"><span class="tab-glyph">今</span><span class="tab-label">今日</span></button>
      <button class="tab" data-page="calendar"><span class="tab-glyph">历</span><span class="tab-label">日历</span></button>
      <button class="tab tab-center" data-page="ziling" aria-label="字灵"><span class="tab-seal"><svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M20 57 L37 31 L54 57"/><path d="M66 57 L83 31 L100 57"/><circle cx="60" cy="80" r="14"/></svg></span></button>
      <button class="tab" data-page="team"><span class="tab-glyph">团</span><span class="tab-label">团队</span></button>
      <button class="tab" data-page="me"><span class="tab-glyph">我</span><span class="tab-label">我的</span></button>
    </nav>

    <!-- 遮罩 + 底部抽屉（新建/编辑任务等） -->
    <div id="scrim"></div>
    <div id="sheet" role="dialog" aria-modal="true"></div>

    <!-- 轻提示 -->
    <div id="toast"></div>
  </div>

  <script type="module" src="js/shell/main.js"></script>
</body>
</html>
